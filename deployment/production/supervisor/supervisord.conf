; supervisord 與所有 program 都以 container 的非 root 使用者（wallet，見 Dockerfile）執行，
; 不設 user=：非 root 的 supervisord 無法也不需要切換身分。
[unix_http_server]
file=/run/supervisor/supervisord.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
; 預設 pidfile 是工作目錄（/var/www/html，程式碼目錄唯讀掛載），改放可寫的 /run/supervisor
pidfile=/run/supervisor/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor/supervisord.sock

[include]
files = /var/www/html/deployment/production/supervisor/supervisor.d/*.ini
